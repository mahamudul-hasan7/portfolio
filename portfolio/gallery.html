<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('theme');
        if (theme !== 'light' && theme !== 'dark') { localStorage.setItem('theme', 'dark'); theme = 'dark'; }
        if (theme === 'light') { document.documentElement.classList.add('light'); } else { document.documentElement.classList.remove('light'); }
        if (window.history && window.history.scrollRestoration) { window.history.scrollRestoration = 'manual'; }
      } catch(e) {}
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1200, initial-scale=1.0" />
  <title>Gallery | Rakib</title>
  <meta name="description" content="A visual gallery of Rakib's work, moments, and milestones." />
  <link rel="icon" type="image/png" href="favicon.png" sizes="32x32" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    .subpage-wrap { max-width: 900px; margin: 0 auto; padding: 3rem 2rem 5rem; }
    .subpage-title { font-size: clamp(1.8rem,5vw,2.6rem); font-weight: 800; color: #3fff7f; margin: 0 0 0.4rem; line-height: 1.15; }
    .subpage-lead { color: #97aab0; font-size: 1rem; line-height: 1.6; margin: 0 0 1.75rem; }
    body.light .subpage-title { color: #167a40; }
    body.light .subpage-lead { color: #546e75; }
    .gallery-filters { display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:1.75rem; }
    .gf-btn { padding:.32rem .9rem; border-radius:999px; border:1px solid #293336; background:transparent; color:#8aacb4; font-size:.8rem; font-weight:600; cursor:pointer; font-family:inherit; transition:background .18s,border-color .18s,color .18s; }
    .gf-btn:hover,.gf-btn.active { background:rgba(63,255,127,.1); border-color:rgba(63,255,127,.38); color:#3fff7f; }
    .gallery-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:.9rem; }
    .gallery-item { position:relative; border-radius:14px; overflow:hidden; cursor:pointer; aspect-ratio:1; background:#1a2224; border:1px solid #293336; transition:transform .22s,box-shadow .22s,border-color .22s; }
    .gallery-item:hover { transform:scale(1.03); box-shadow:0 10px 28px rgba(0,0,0,.45); border-color:#3fff7f55; }
    .gallery-item img { width:100%; height:100%; object-fit:cover; display:block; }
    .gallery-item-overlay { position:absolute; inset:0; background:rgba(10,18,20,.55); display:flex; flex-direction:column; align-items:flex-start; justify-content:flex-end; padding:.85rem; opacity:0; transition:opacity .22s; }
    .gallery-item:hover .gallery-item-overlay { opacity:1; }
    .gallery-item-caption { color:#e8f0f2; font-size:.82rem; font-weight:600; line-height:1.3; }
    .gallery-item-sub { color:#97aab0; font-size:.72rem; margin-top:.18rem; }
    .gallery-item.tall { grid-row:span 2; aspect-ratio:unset; }
    .gallery-lb { display:none; position:fixed; inset:0; z-index:999; background:rgba(5,10,12,.9); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); align-items:center; justify-content:center; }
    .gallery-lb.open { display:flex; }
    .gallery-lb img { max-width:min(90vw,700px); max-height:85vh; border-radius:16px; box-shadow:0 24px 64px rgba(0,0,0,.7); object-fit:contain; }
    .gallery-lb-close { position:absolute; top:1.25rem; right:1.25rem; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); border-radius:10px; width:42px; height:42px; display:flex; align-items:center; justify-content:center; color:#e6e6e6; font-size:1.4rem; cursor:pointer; transition:background .18s; }
    .gallery-lb-close:hover { background:rgba(255,255,255,.15); }
    body.light .gallery-item { background:#edf4f0; border-color:rgba(0,0,0,.1); }
    body.light .gallery-item:hover { border-color:rgba(22,130,75,.3); }
    body.light .gf-btn { border-color:rgba(0,0,0,.15); color:#4e6068; }
    body.light .gf-btn:hover,body.light .gf-btn.active { background:rgba(22,130,75,.1); border-color:rgba(22,130,75,.35); color:#196644; }
    @media (max-width:700px) { .subpage-wrap{padding:2rem 1rem 4rem;} .gallery-grid{grid-template-columns:repeat(2,1fr);gap:.65rem;} .gallery-item.tall{grid-row:unset;aspect-ratio:1;} }
    @media (max-width:400px) { .gallery-grid{grid-template-columns:1fr;} }
  </style>
</head>
<body>

    <div class="subpage-wrap">
      <h1 class="subpage-title">Gallery</h1>
      <p class="subpage-lead">Moments, milestones, and visuals from my journey as a developer and student.</p>
      <div class="gallery-filters">
        <button class="gf-btn active" data-filter="all">All</button>

      </div>

  <div class="gallery-lb" id="galleryLb" role="dialog" aria-modal="true" aria-label="Image lightbox">
    <button class="gallery-lb-close" id="galleryLbClose" aria-label="Close lightbox">×</button>
    <img id="galleryLbImg" src="" alt="" />
  </div>
  <script src="js/script.js"></script>
  <script>
    var filterBtns = document.querySelectorAll('.gf-btn');
    var galleryItems = document.querySelectorAll('.gallery-item');
    filterBtns.forEach(function(btn) {
      btn.addEventListener('click', function() {
        filterBtns.forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        var filter = btn.dataset.filter;
        galleryItems.forEach(function(item) {
          item.style.display = (filter === 'all' || item.dataset.cat === filter) ? '' : 'none';
        });
      });
    });
    var lb = document.getElementById('galleryLb');
    var lbImg = document.getElementById('galleryLbImg');
    var lbClose = document.getElementById('galleryLbClose');
    galleryItems.forEach(function(item) {
      item.addEventListener('click', function() {
        lbImg.src = item.dataset.img;
        lbImg.alt = item.querySelector('img').alt;
        lb.classList.add('open');
        document.body.style.overflow = 'hidden';
      });
    });
    function closeLb() { lb.classList.remove('open'); document.body.style.overflow = ''; lbImg.src = ''; }
    lbClose.addEventListener('click', closeLb);
    lb.addEventListener('click', function(e) { if (e.target === lb) closeLb(); });
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeLb(); });
  </script>
